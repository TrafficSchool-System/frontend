name: Build & Deploy frontend

on:
  push:
    branches: [main]

env:
  APP_NAME: frontend
  RESOURCE_GROUP: trafficschool-rg
  ENVIRONMENT: trafficschool-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Logga in på Azure
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Logga in på ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Rensa API URL
        id: apiurl
        run: |
          CLEAN=$(echo "${{ secrets.VITE_API_BASE_URL }}" | tr -d '[:space:]' | sed 's|[./]*$||')
          echo "value=$CLEAN" >> $GITHUB_OUTPUT

      - name: Bygg och pusha Docker-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.APP_NAME }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.APP_NAME }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ steps.apiurl.outputs.value }}

      - name: Driftsätt till Azure Container Apps
        run: |
          az containerapp up \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.ENVIRONMENT }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.APP_NAME }}:${{ github.sha }} \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --target-port 80 \
            --ingress external

      - name: Sätt minimum 1 replik (förhindra scale-to-zero)
        run: |
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --min-replicas 1
